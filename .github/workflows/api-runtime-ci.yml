name: API Runtime CI

# Deployment 2 — CI runtime (niveau 2) de l'API Core NestJS (baseline `base`).
# Valide la baseline contre sa dépendance runtime MINIMALE (PostgreSQL jetable) :
# migrations Prisma, tests unitaires + e2e, contrôle du contrat OpenAPI, build, audit.
# SANS déploiement, registry/GHCR, Dockerfile applicatif, secret GitHub ni environnement protégé.
#
# Notes d'implémentation :
# - `starters/nestjs/` est un projet npm AUTONOME (lockfile propre, hors workspaces racine) :
#   on installe et exécute via `working-directory: starters/nestjs` + `npm ci`.
# - PostgreSQL : conteneur `services:` (aucune commande custom requise).
# - Depuis Capability Packs 1A, la baseline ne contient ni Auth ni Files : plus de
#   MinIO ni de variables JWT/S3 ici. Les compositions `base + auth` sont vérifiées
#   par les goldens de la Factory, hors dépôt.
# - Toutes les valeurs ci-dessous sont des VALEURS DE TEST JETABLES de CI, jamais des secrets.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: api-runtime-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Périmètre (ADR-094) : sur PR, le job est SAUTÉ si son périmètre n'est pas touché
  # (sauté = succès pour un check requis ; le nom du check reste stable). Push main : exécuté.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      apiRuntime: ${{ steps.scope.outputs.apiRuntime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        run: node factory/quality/scripts/ci-scope.mjs "${{ github.event_name }}"

  api-runtime:
    name: api-runtime
    needs: scope
    if: needs.scope.outputs.apiRuntime == 'true'
    runs-on: ubuntu-latest

    # PostgreSQL en service (image officielle, pas de commande custom).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: enistere_api_test
          POSTGRES_USER: enistere
          POSTGRES_PASSWORD: enistere_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enistere -d enistere_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Variables d'environnement de TEST (jetables, non sensibles). Aucune valeur de production.
    # Aucune référence à secrets.* (cf. docs/Server Prod/POLITIQUE.md « Identité et secrets »).
    env:
      NODE_ENV: test
      PORT: "3001"
      DATABASE_URL: postgresql://enistere:enistere_test_password@localhost:5432/enistere_api_test?schema=public
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      SERVICE_NAME: api-nestjs-core
      LOG_LEVEL: warn
      LOG_PRETTY: "false"

    defaults:
      run:
        working-directory: starters/nestjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: starters/nestjs/package-lock.json

      - name: Install (npm ci — projet API autonome)
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Prisma validate
        run: npm run prisma:validate

      - name: Prisma migrate (deploy sur base jetable)
        run: npm run prisma:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Tests e2e (PostgreSQL jetable)
        run: npm run test:e2e

      - name: OpenAPI — snapshot canonique à jour
        run: npm run openapi:check

      - name: Build (nest build)
        run: npm run build

      - name: npm audit (exceptions documentées, scopées et datées — sans désactivation globale)
        run: node ../../factory/quality/scripts/audit-check.mjs . --targets nestjs
