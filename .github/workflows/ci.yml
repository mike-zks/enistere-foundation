name: CI

# CI minimale (ADR-094) — quatre jobs aux noms stables, qui sont les checks requis
# de la branche protégée : kernel, secret-scan, docs, audit. Aucun déploiement,
# registry, image, secret ni publication.

on:
  pull_request:
  push:
    branches:
      - main

# Lecture seule : la CI ne pousse rien et n'utilise aucun secret.
permissions:
  contents: read

# Annule les exécutions précédentes obsolètes sur la même référence.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kernel contracts A1–A7 et golden Asteria (preuve E0).
  kernel:
    name: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: typecheck (Kernel contracts + golden Asteria)
        run: npm run foundation:typecheck
      - name: tests (primitives, A1–A7, ensemble fermé, golden Asteria octet pour octet)
        run: npm run foundation:test
      - name: golden Asteria régénéré à l'identique (anti-dérive)
        run: |
          npm run golden:asteria:update
          git status --porcelain goldens/
          test -z "$(git status --porcelain goldens/)"

  # Analyse de secrets (ADR-073) sur tout l'historique : un secret retiré du HEAD
  # reste exposé dans les commits.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: outillage du dépôt (tests)
        run: npm run tools:test
      - name: allowlist justifiée et non expirée
        run: npm run secrets:allowlist
      - name: gitleaks (binaire épinglé, checksum vérifié)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          # Binaire vérifié plutôt qu'une action tierce : chaîne d'approvisionnement auditable.
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          # --redact : une détection ne publie jamais le secret dans les journaux.
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --log-opts=--all \
            --exit-code 1

  # Aucun lien interne mort dans la documentation vivante (docs/archive exclu).
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run docs:links

  # Dépendances : aucune vulnérabilité haute ou critique.
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
